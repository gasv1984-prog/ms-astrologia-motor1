<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Motor astrológico · MS Astrología</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0d0c18;color:#f7f2e8}
    body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;background:radial-gradient(circle at 50% 15%,#27213d 0,#0d0c18 48%)}
    main{width:min(720px,100%);padding:40px;border:1px solid #3b344d;border-radius:28px;background:rgba(20,18,34,.88);box-shadow:0 24px 80px #0008}
    .eyebrow{color:#d8be77;letter-spacing:.18em;text-transform:uppercase;font-weight:800}h1{font-family:Georgia,serif;font-size:clamp(2.5rem,8vw,5rem);margin:.3em 0}p{color:#bbb3c7;line-height:1.7}.status{display:flex;gap:12px;align-items:center;margin-top:28px;padding:16px;border-radius:14px;background:#151326}.dot{width:11px;height:11px;border-radius:50%;background:#d8be77;box-shadow:0 0 22px #d8be77}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Infraestructura gratuita</div>
    <h1>Motor astral en GitHub</h1>
    <p>Este sitio sirve Swiss Ephemeris WebAssembly. Los cálculos tropicales y las casas Placidus se ejecutan en el navegador; la inteligencia artificial no inventa posiciones planetarias.</p>
    <div class="status"><span class="dot"></span><span>Motor publicado y preparado para MS Astrología.</span></div>
  </main>
</body>
</html>
