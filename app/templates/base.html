<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Solicitudes y calculos astrologicos precisos con interpretacion opcional por IA.">
  <title>{% block title %}msastrologia{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/ms-logo.png?v=0.4.0">
  <link rel="stylesheet" href="/static/styles.css?v=0.4.0">
  <script defer src="/static/app.js?v=0.4.0"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/" aria-label="msastrologia, inicio">
      <img class="brand-logo" src="/static/ms-logo.png" alt="Miguel Salazar Colombia">
    </a>
    {% if admin %}
    <nav class="admin-nav" aria-label="Administracion">
      <a href="/admin">Cartas natales</a>
      <a href="/admin/horoscopos">Horóscopos</a>
      <a href="/admin/ia">Inteligencia artificial</a>
      <a href="/admin/perfil">Perfil</a>
      <form action="/admin/logout" method="post">
        <input type="hidden" name="csrf" value="{{ session.csrf }}">
        <button class="link-button" type="submit">Salir</button>
      </form>
    </nav>
    {% else %}
    <nav class="public-nav" aria-label="Navegación principal">
      <a href="/solicitar">Solicitar carta</a>
      <a href="/mi-solicitud">Consultar carta</a>
      <a href="/horoscopo">Horóscopo</a>
      <a href="/admin/login">Administración</a>
    </nav>
    {% endif %}
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <span>Miguel Salazar · MS Astrología</span>
    <span>Cálculos tropicales · Casas Placidus · Ubicaciones GeoNames</span>
  </footer>
</body>
</html>
