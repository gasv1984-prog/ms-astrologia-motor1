name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"
      - name: Ejecutar pruebas
        run: python -m pytest -q

  php:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, mbstring, openssl, pdo_mysql, zlib
      - name: Validar sintaxis PHP
        run: find shared-hosting -type f -name '*.php' -print0 | xargs -0 -n1 php -l

  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Validar JavaScript
        run: |
          node --check shared-hosting/assets/app.js
          node --check app/static/app.js
