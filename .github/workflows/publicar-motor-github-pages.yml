name: Publicar motor astrológico

on:
  push:
    branches: [main]
    paths:
      - "github-pages/**"
      - ".github/workflows/publicar-motor-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages
      - name: Publicar motor
        id: deployment
        uses: actions/deploy-pages@v5
