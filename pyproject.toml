[project]
name = "msastrologia"
version = "0.1.0"
description = "Gestion de solicitudes astrologicas con calculo local e interpretacion opcional por IA"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
  "cairosvg>=2.7,<3",
  "cryptography>=42,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "kerykeion==5.12.9",
  "markdown>=3.7,<4",
  "python-multipart>=0.0.12,<1",
  "pytz>=2024.2",
  "reportlab>=4.2,<5",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*", "static/generated/.gitkeep"]
